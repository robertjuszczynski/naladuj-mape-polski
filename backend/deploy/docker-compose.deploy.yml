# Warstwa wdrożeniowa dla serwera demonstracyjnego (domena publiczna, Let's Encrypt, hasło do czasu oddania).
# Użycie (z katalogu backend/):
#   docker compose -f docker-compose.local.yml -f deploy/docker-compose.deploy.yml up -d <usługi>
services:
  mcod-nginx:
    volumes:
      - ./deploy/nginx-templates:/etc/nginx/templates:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./statics:/usr/share/nginx/html/statics
      - ./media:/usr/share/nginx/html/media

  mcod-frontend:
    container_name: mcod-frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: serve-static
      args:
        MCOD_BUILD_CONFIGURATION_ENV: int
    image: mcod-frontend:deploy
    restart: unless-stopped
    volumes:
      - ./deploy/frontend-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      backend:
        ipv4_address: 172.18.18.120
