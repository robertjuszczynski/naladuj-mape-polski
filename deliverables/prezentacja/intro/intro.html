const SYG_CENTER = [SYG_OFF[0] + 63.28, SYG_OFF[1] + 50];

const VIEW_A = { cx: SYG_CENTER[0], cy: SYG_CENTER[1], s: 7.2 };
const VIEW_B = { cx: LOGO.center[0], cy: LOGO.center[1] + 2, s: 4.05 };

const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, [a, b]) => clamp((t - a) / (b - a));
const easeInOutSine = p => -(Math.cos(Math.PI * p) - 1) / 2;
const easeInOutCubic = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeOutCubic = p => 1 - Math.pow(1 - p, 3);

  $('pulseGlow').setAttribute('opacity', pulseGlow);
  $('pulseGlow').style.strokeDasharray = '100 100';
  $('pulseGlow').setAttribute('pathLength', 100);
  $('pulseGlow').style.strokeDashoffset = 100 - 100 * pp;
  $('contourGlow').setAttribute('opacity', t < T.drawA[1] ? 0 : clamp(beat * 3.2));

  const dotsFade = 1 - easeInOutSine(prog(t, T.dotsOut));
  for (const d of dots) {
    let level = 0, flash = 0;
    T.beats.forEach((b, i) => {
      const ti = b + d.delay;
      if (t < ti) return;
      const age = t - ti;
      flash = Math.max(flash, Math.exp(-age / 0.16));
      if (i >= d.wave) level = Math.max(level, 0.62 * clamp(age / 0.08));
    });
    const lit = d.wave === 0 || t >= T.beats[1] + d.delay;
    const o = (lit ? level : 0) + (lit ? flash * 0.5 : 0);
    d.el.setAttribute('opacity', clamp(o) * dotsFade);
    d.el.setAttribute('r', 1.15 + 1.4 * (lit ? flash : 0));
    d.el.setAttribute('fill', d.red && flash < 0.5 ? '#ff5a68' : '#ffffff');
  }

  ringEvents.forEach((e, i) => {
    const age = t - e.t, c = rings[i];
    if (age < 0 || age > 1.25) { c.setAttribute('opacity', 0); return; }
    const p = age / 1.25;
    c.setAttribute('r', 8 + 230 * easeOutCubic(p) * (0.55 + 0.45 * e.k));
    c.setAttribute('stroke-width', (2.6 * (1 - p) + 0.2) * (0.6 + 0.4 * e.k));
    c.setAttribute('opacity', 0.6 * Math.pow(1 - p, 1.6) * e.k);
  });

  const gx = 960 + v.s * (ORIGIN[0] - v.cx), gy = 540 + v.s * (ORIGIN[1] - v.cy);
  const glow = $('glow');
  glow.setAttribute('cx', gx); glow.setAttribute('cy', gy);
  const base = t < T.drawP[0] ? 0 : 0.35 * clamp((t - T.drawP[0]) / 0.6);
  glow.setAttribute('opacity', clamp(base + zap * 0.5 + beat * 5) * (1 - fp));
  glow.setAttribute('r', 700 + beat * 1800);

  letters.forEach((g, i) => {
    const p = easeOutExpo(prog(t, [T.words + i * 0.045, T.words + i * 0.045 + 0.85]));
    g.wrap.setAttribute('transform', `translate(0 ${(1 - p) * 16})`);
    g.wrap.setAttribute('opacity', clamp(p * 1.4));
  });
  if (period) {
    if (!periodBox) { period.wrap.removeAttribute('transform'); periodBox = period.wrap.getBBox(); }
    const cx = periodBox.x + periodBox.width / 2, cy = periodBox.y + periodBox.height / 2;
    const p = prog(t, [T.period, T.period + 0.5]);
    const sc = p <= 0 ? 0 : easeOutBack(p);
    period.wrap.setAttribute('transform', `translate(${cx} ${cy}) scale(${Math.max(sc, 0.0001)}) translate(${-cx} ${-cy})`);
    period.wrap.setAttribute('opacity', p > 0 ? 1 : 0);
  }
}

window.__render = render;
window.__duration = T.end;

const params = new URLSearchParams(location.search);
if (params.has('clean') || params.has('capture')) document.body.classList.add('clean');
const sfx = $('sfx');
let muted = params.has('mute'), t0 = null, raf = 0;

function start() {
  document.body.classList.add('started');
  cancelAnimationFrame(raf);
  if (!muted) { try { sfx.currentTime = 0; sfx.play().catch(() => {}); } catch (e) {} }
  t0 = null;
  const loop = now => {
    if (t0 === null) t0 = now;
    const t = (now - t0) / 1000;
    render(t);
    if (t < T.end) raf = requestAnimationFrame(loop);
    else { window.dispatchEvent(new Event('intro:end')); if (window.parent !== window) window.parent.postMessage('intro:end', '*'); }
  };
  raf = requestAnimationFrame(loop);
}

render(params.has('t') ? Number(params.get('t')) : 0);
if (params.has('embed')) {
  muted = true;
  document.body.classList.add('clean');
  addEventListener('message', e => {
    const m = e.data || {};
    if (m.type === 'start') start();
    else if (m.type === 'seek') { cancelAnimationFrame(raf); render(m.t); }
  });
} else if (!params.has('capture')) {
  addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); if (!document.body.classList.contains('started')) start(); }
    else if (e.key === 'r' || e.key === 'R') start();
    else if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
    else if (e.key === 'm' || e.key === 'M') { muted = !muted; if (muted) sfx.pause(); }
  });
  addEventListener('click', () => { if (!document.body.classList.contains('started')) start(); });
  if (params.has('autoplay')) start();
}
</script>
</body>
</html>
