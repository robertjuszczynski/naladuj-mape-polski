<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Naładuj mapę Polski – okładka</title>
<style>
@font-face { font-family: "ManropeS"; font-weight: 600; src: url("assets/fonts/manrope-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: "ManropeS"; font-weight: 600; src: url("assets/fonts/manrope-latin-ext-600-normal.woff2") format("woff2"); unicode-range: U+0100-02BA; }
@font-face { font-family: "ManropeS"; font-weight: 800; src: url("assets/fonts/manrope-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: "ManropeS"; font-weight: 800; src: url("assets/fonts/manrope-latin-ext-800-normal.woff2") format("woff2"); unicode-range: U+0100-02BA; }
@font-face { font-family: "Plex Mono"; font-weight: 500; src: url("assets/fonts/ibm-plex-mono-latin-500.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: "Plex Mono"; font-weight: 500; src: url("assets/fonts/ibm-plex-mono-latin-ext-500.woff2") format("woff2"); unicode-range: U+0100-02BA; }
:root { --navy: #0B2545; --deep: #051427; --red: #D62839; --red-soft: #ff5a68; --cream: #F7F4EE; --dim: rgba(247,244,238,.78); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 800px; height: 600px; overflow: hidden; }
body { position: relative; font-family: "ManropeS", system-ui, sans-serif; color: var(--cream); -webkit-font-smoothing: antialiased;
  background: radial-gradient(ellipse at 66% 46%, #143e70 0%, var(--navy) 40%, var(--deep) 100%); }

.mark { position: absolute; left: 372px; top: 34px; width: 470px; height: 319px; overflow: visible; }
.mark .dot { fill: rgba(247,244,238,.2); }
.mark .dot.on { fill: var(--red-soft); }

.word { position: absolute; left: 44px; top: 356px; font-weight: 800; font-size: 62px; line-height: .98; letter-spacing: -.035em; }
.word span { color: var(--red); }
.desc { position: absolute; left: 44px; top: 494px; width: 540px; text-wrap: balance; font-weight: 600; font-size: 17px; line-height: 1.45; color: var(--dim); }
.desc b { color: var(--cream); font-weight: 800; }
.meta { position: absolute; left: 44px; top: 44px; font: 500 13px/1 "Plex Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.cta { position: absolute; left: 44px; top: 66px; font: 500 13px/1 "Plex Mono", monospace; letter-spacing: .04em; color: #ff8a94; }
</style>
</head>
<body>
  <p class="meta">HackNation 2026 · Misja AED</p>
  <svg class="mark" viewBox="6 0 112 76" aria-hidden="true">
    <g id="dots"></g>
    <path id="contour" d="M74.18 45.85 L79.11 39.25 L72.79 23.18 L45.70 23.36 L41.26 18.00 L34.07 19.19 L13.42 27.76 L17.47 61.77 L27.45 64.01 L29.85 70.10 L31.49 66.53 L37.07 67.84 L51.29 80.11 L63.72 77.68 L71.65 82.00 L70.58 76.29 L80.33 65.39 L77.77 57.31" transform="translate(0 -8)" fill="none" stroke="#F7F4EE" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M77.77 57.31 H86.19 L91.66 36.26 L97.56 76.68 L102.61 57.31 H160" transform="translate(0 -8)" fill="none" stroke="#D62839" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1 class="word">Naładuj mapę<br>Polski<span>.</span></h1>
  <p class="desc">Wszystkie defibrylatory w jednym otwartym zbiorze <b>dane.gov.pl</b>. Instytucje dodają swoje AED w kilka minut, a 112 i każdy z nas widzi najbliższy otwarty.</p>
  <p class="cta">Udostępnij dane o swoim AED</p>
<script>
const pts = document.getElementById('contour').getAttribute('d').match(/-?\d+(\.\d+)?/g).map(Number).reduce((a, v, i) => (i % 2 ? a[a.length - 1].push(v - 8) : a.push([v]), a), []);
function inside([x, y]) { let c = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const [xi, yi] = pts[i], [xj, yj] = pts[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }
function edge([x, y]) { let m = 1e9; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const [ax, ay] = pts[j], [bx, by] = pts[i], dx = bx - ax, dy = by - ay, u = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy))); m = Math.min(m, Math.hypot(x - ax - u * dx, y - ay - u * dy)); } return m; }
let seed = 11; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
let html = '';
for (let y = 12; y < 76; y += 2.6) for (let x = 14; x < 82; x += 2.6) {
  const p = [x + (Math.round(y / 2.6) % 2) * 1.3, y];
  if (!inside(p) || edge(p) < 2.6) continue;
  const on = r() < 0.09;
  html += `<circle class="dot${on ? ' on' : ''}" cx="${p[0].toFixed(2)}" cy="${p[1].toFixed(2)}" r="${on ? 0.75 : 0.5}"/>`;
}
document.getElementById('dots').innerHTML = html;
</script>
</body>
</html>
